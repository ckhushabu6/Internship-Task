<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>

  <link rel="stylesheet" href="../css/auth.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center auth-container">
  <div class="card auth-card shadow" style="width: 400px;">

    <h3 class="text-center mb-3">Register</h3>

    <form id="registerForm">

      <input type="text" id="name" class="form-control mb-2" placeholder="Full Name">
      <small id="nameError" class="error-text"></small>

      <input type="email" id="email" class="form-control mb-2" placeholder="Email">
      <small id="emailError" class="error-text"></small>

      <input type="password" id="password" class="form-control mb-2" placeholder="Password">
      <small id="passwordError" class="error-text"></small>

      <select id="role" class="form-control mb-2">
        <option value="user">User</option>
        <option value="employer">Employer</option>
      </select>

      <button class="btn btn-success w-100 mt-3">Register</button>

    </form>

    <p class="text-center mt-3">
      Already have an account? <a href="login.html">Login</a>
    </p>

  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
