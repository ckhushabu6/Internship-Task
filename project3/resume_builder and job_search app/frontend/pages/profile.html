<!DOCTYPE html>
<html lang="en">
<head>
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">

  <h2>User Profile</h2>

  <div id="messageBox" class="alert d-none"></div>

  <form id="profileForm">
    <input id="name" class="form-control mb-2" placeholder="Name">
    <input id="email" class="form-control mb-2" disabled>

    <input id="skills" class="form-control mb-2" placeholder="Skills (comma separated)">

    <textarea id="education" class="form-control mb-2" placeholder="Education"></textarea>
    <textarea id="experience" class="form-control mb-2" placeholder="Experience"></textarea>

    <button class="btn btn-primary w-100">Update Profile</button>
  </form>

</div>

<script src="../js/profile.js"></script>
</body>
</html>
