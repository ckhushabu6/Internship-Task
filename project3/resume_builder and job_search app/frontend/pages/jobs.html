<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs</title>

  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container my-4">

  <h2 class="mb-4 text-center">Find Jobs</h2>

  <!-- 🔍 SEARCH -->
  <div class="row mb-3 g-2">
    <div class="col-md-5">
      <input type="text" id="skillInput" class="form-control" placeholder="Search by skill (React, Node)">
    </div>

    <div class="col-md-5">
      <input type="text" id="locationInput" class="form-control" placeholder="Search by location">
    </div>

    <div class="col-md-2 d-grid">
      <button class="btn btn-primary" onclick="fetchJobs()">Search</button>
    </div>
  </div>

  <!-- JOB LIST -->
  <div id="jobsContainer" class="row g-3"></div>

  <!-- EMPTY STATE -->
  <div id="emptyState" class="text-center mt-4 d-none">
    <p>No jobs found</p>
  </div>

</div>

<script src="../js/jobs.js"></script>
</body>
</html>
