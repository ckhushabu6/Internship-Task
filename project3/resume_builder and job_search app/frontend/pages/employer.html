<!DOCTYPE html>
<html>
<head>
  <title>Employer Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<div class="d-flex">

  <!-- LEFT SIDEBAR -->
  <div class="sidebar p-3">
    <h4 class="text-white">Employer</h4>

   <ul class="nav flex-column mt-4">

  <li>
    <a href="#" onclick="showSection('dashboard')" class="nav-link">
      <i class="fas fa-chart-line me-2"></i> Dashboard
    </a>
  </li>

  <li>
    <a href="#" onclick="showSection('postJob')" class="nav-link">
      <i class="fas fa-plus-circle me-2"></i> Post Job
    </a>
  </li>

  <li>
    <a href="#" onclick="showSection('jobs')" class="nav-link">
      <i class="fas fa-briefcase me-2"></i> My Jobs
    </a>
  </li>

  <li>
    <a href="#" onclick="logout()" class="nav-link text-danger">
      <i class="fas fa-sign-out-alt me-2"></i> Logout
    </a>
  </li>

</ul>
  </div>

  <!-- RIGHT SIDE -->
  <div class="main flex-grow-1">

    <!-- TOP BAR -->
    <div class="topbar p-3 shadow-sm d-flex justify-content-between">
      <h5>Dashboard</h5>
      <span id="userName"></span>
    </div>

    <div class="p-4">
      <div id="messageBox" class="alert d-none text-center"></div>

      <!-- DASHBOARD -->
      <div id="dashboardSection">
        <div class="row">

          <div class="col-md-4">
  <div class="card p-3 text-center shadow-sm">
    <i class="fas fa-briefcase fa-2x mb-2 text-primary"></i>
    <h6>Total Jobs</h6>
    <h3 id="totalJobs">0</h3>
  </div>
</div>

        </div>
      </div>

      <!-- POST JOB -->
      <div id="postJobSection" class="d-none">
        <h4>Post Job</h4>

        <form id="jobForm" class="card p-3">
          <input id="title" class="form-control mb-2" placeholder="Title">
          <input id="company" class="form-control mb-2" placeholder="Company">
          <input id="location" class="form-control mb-2" placeholder="Location">
          <input id="skills" class="form-control mb-2" placeholder="Skills">
          <textarea id="description" class="form-control mb-2"></textarea>

         <button type="submit" class="btn btn-primary">Save Job</button>
        </form>
      </div>

      <!-- JOB LIST -->
      <div id="jobsSection" class="d-none">
        <h4>My Jobs</h4>
        <div id="jobList" class="row"></div>
      </div>

    </div>

  </div>

</div>

<script src="../js/main.js"></script>
<script src="../js/employer.js"></script>

</body>
</html>
