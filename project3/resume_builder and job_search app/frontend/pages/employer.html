<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employer Dashboard</title>

  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container my-4">

  <h2 class="text-center mb-4">Employer Dashboard</h2>

  <!-- MESSAGE -->
  <div id="messageBox" class="alert d-none text-center"></div>

  <!-- POST JOB -->
  <div class="card p-3 mb-4">
    <h5>Post New Job</h5>

    <form id="jobForm">
      <input type="text" id="title" class="form-control mb-2" placeholder="Job Title" required>
      <input type="text" id="company" class="form-control mb-2" placeholder="Company" required>
      <input type="text" id="location" class="form-control mb-2" placeholder="Location">

      <input type="text" id="skills" class="form-control mb-2" placeholder="Skills (comma separated)">

      <textarea id="description" class="form-control mb-2" placeholder="Job Description"></textarea>

      <button class="btn btn-primary w-100">Post Job</button>
    </form>
  </div>

  <!-- JOB LIST -->
  <h4>Your Jobs</h4>
  <div id="jobList" class="row g-3"></div>

</div>

<script src="../js/employer.js"></script>
</body>
</html>
