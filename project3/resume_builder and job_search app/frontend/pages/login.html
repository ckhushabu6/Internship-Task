<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="stylesheet" href="../css/auth.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center auth-container">
  <div class="card auth-card shadow" style="width: 400px;">

    <h3 class="text-center mb-3">Login</h3>

    <form id="loginForm">

      <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email">
      <small id="loginEmailError" class="error-text"></small>

      <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password">
      <small id="loginPasswordError" class="error-text"></small>

      <button class="btn btn-primary w-100 mt-3">Login</button>

    </form>

    <p class="text-center mt-3">
      Don't have an account? <a href="register.html">Register</a>
    </p>

  </div>
</div>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
